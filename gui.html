<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Block Diagram</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f9f9f9;
      margin: 10px;
      padding: 0;
    }
    #diagram-container {
      border: 2px solid #333;
      width: 75%;
      height: 650px;
      position: relative;
      background-color: #ffffff;
      margin: 10px 10px 10px 0;
      overflow: hidden;
    }
    #edit-menu {
      width: 20%;
      height: 580px;
      position: relative;
      padding: 10px;
      background: #eee;
      display: none;
      margin: 10px 0px 0px 0px;

    }
    #edit-container {
      display: flex;
      align-items: flex-start;
      height: 600px;
    }
    #edit-menu label, #edit-menu input {
      display: block;
      margin-bottom: 10px;
    }
    #edit-menu textarea {
      width: 100%;
      box-sizing: border-box;
      margin-bottom: 10px;
      resize: vertical;
    }
    .block {
      width: 90px;
      height: 60px;
      background-color: #ffffff;
      color: black;
      text-align: center;
      border: 2px solid #000;
      border-radius: 4px;
      position: absolute;
      cursor: pointer;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      font-size: 12px;
    }
    .block.transfer_function { width: 120px; }
    .block.pid {
      width: 120px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-weight: normal;
    }
    .block.pid .pid-content {
      font-size: 12px;
      font-weight: normal;
      line-height: 1.2;
      max-width: 100%;
      padding: 0 6px;
      box-sizing: border-box;
      white-space: normal;
      word-break: break-word;
    }
    #pid-options .pid-field {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
    }
    #pid-options .pid-field label {
      margin-bottom: 0;
      min-width: 45px;
    }
    #pid-options .pid-field input {
      flex: 0 0 80px;
      max-width: 80px;
    }
    .block.operation {
      width: 50px;
      height: 50px;
      border-radius: 50%;
    }
    .block.gain {
      width: 60px;
      height: 60px;
      position: absolute;
      border: none;
      background: none;
      box-shadow: none;
    }
    .block.text {
      width: fit-content;
      max-width: 320px;
      min-width: 40px;
      height: fit-content;
      padding: 8px;
      box-sizing: border-box;
      display: inline-flex;
      align-items: flex-start;
      justify-content: flex-start;
      cursor: move;
      border: 2px solid transparent;
      border-radius: 0;
      background: transparent;
      box-shadow: none;
    }
    .block.text .block-name {
      display: none;
    }
    .text-block-content {
      width: auto;
      text-align: left;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      line-height: 1.3;
      font-size: 14px;
    }
    .text-block-content mjx-container {
      font-size: 1em;
      max-width: 100%;
    }
    .text-block-content mjx-container > svg {
      max-width: 100%;
      height: auto;
    }
    .block-name {
      position: absolute;
      width: 100%;
      text-align: center;
      top: calc(100% + 5px);
      left: 0;
      font-size: 12px;
    }
    .block.operation .block-name { display: none; }
    .selected { border: 2px solid #ff0000; }
    .block.text.selected { border: 2px solid #ff0000; }
    .connector {
      width: 9px;
      height: 9px;
      background-color: #000;
      border-radius: 50%;
      position: absolute;
      cursor: crosshair;
    }
    .connector.left { top: 50%; left: -5px; transform: translateY(-50%); }
    .connector.right { top: 50%; right: -5px; transform: translateY(-50%); }
    .connector.bottom { bottom: -5px; left: 50%; transform: translateX(-50%); }
    .connector.top { top: -5px; left: 50%; transform: translateX(-50%); }
    .connector.active { background-color: #ff0000; }
    #controls-container {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    #left-controls {
      display: flex;
      gap: 10px;
    }
    #run-container {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-grow: 1;
    }
    .transfer-function-content {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100%;
      margin: 0 5px;
      text-align: center;
      font-size: 12px;
    }
    .transfer-function-content .numerator,
    .transfer-function-content .denominator { display: block; }
    .transfer-function-content hr {
      width: 80%;
      margin: 2px 0;
      border: none;
      border-top: 1px solid #000;
    }
    .block.gain.flipped svg {
      transform: scaleX(-1);
    }
    .block.gain.selected {
      border: 2px solid #ff0000; /* Add a red border */
    }
    #edit-menu input[type="text"] {
      width: 100%;
      box-sizing: border-box;
    }
  </style>
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']]
      },
      svg: {
        fontCache: 'global'
      }
    };
  </script>
  <script defer id="MathJax-script" src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
</head>
<body>
  <div id="controls-container">
    <div id="left-controls">
      <select id="block-type-dropdown">
        <option value="" disabled selected>Blocks</option>
        <option value="input">Input</option>
        <option value="transfer_function">Transfer Function</option>
        <option value="output">Output</option>
        <option value="operation">Operation</option>
        <option value="gain">Gain</option>
        <option value="pid">PID</option>
        <option value="text">Text</option>
      </select>
      <button id="delete-block-btn">Delete</button>
      <button id="clear-btn">Clear</button>
    </div>
    <div id="run-container" style="display: flex; align-items: center; gap: 10px;">
      <label for="sim-time">Simulation Time (s):</label>
      <input type="number" id="sim-time" value="10" step="1" style="width: 80px;">
      <label for="step-size">Step:</label>
      <input type="number" id="step-size" value="0.001" step="0.001" style="width: 80px;">
      <button id="save-btn">Save</button>
      <button id="load-btn">Load</button>
    </div>
  </div>

  <div id="edit-container">
    <div id="diagram-container">
      <canvas id="diagram-canvas"></canvas>
    </div>
    <div id="edit-menu">
      <div id="edit-menu-text" style="margin-bottom: 10px;"></div>
      <div id="input-options" class="block-options">
        <div style="margin-bottom: 15px">
          <label for="input-name">Name:</label>
          <input type="text" id="input-name">
          <label for="input-signal">Signal:</label>
          <select id="input-signal">
            <option value="step" selected>Step</option>
            <option value="impulse">Impulse</option>
            <option value="ramp">Ramp</option>
          </select>
        </div>
        <div id="input-extra-options" style="display:none; margin-bottom:15px;">
          <label for="input-t0">t0:</label>
          <input type="text" id="input-t0">
          <div id="step-options" style="display:none;">
            <label for="input-step-a0">A0:</label>
            <input type="text" id="input-step-a0">
            <label for="input-step-a">A:</label>
            <input type="text" id="input-step-a">
          </div>
          <div id="impulse-options" style="display:none;">
            <label for="input-impulse-a">A:</label>
            <input type="text" id="input-impulse-a">
            <label for="input-impulse-epsilon">ε:</label>
            <input type="text" id="input-impulse-epsilon" value="10^-3">
          </div>
          <div id="ramp-options" style="display:none;">
            <label for="input-ramp-a0">A0:</label>
            <input type="text" id="input-ramp-a0">
            <label for="input-ramp-m">m:</label>
            <input type="text" id="input-ramp-m">
          </div>
        </div>
      </div>
      <div id="transfer-function-options" class="block-options">
        <label for="transfer-function-name">Name:</label>
        <input type="text" id="transfer-function-name">
        <label for="transfer-function-num">Numerator:</label>
        <input type="text" id="transfer-function-num">
        <hr style="width: 100%; margin: 10px 0;">
        <label for="transfer-function-den">Denominator:</label>
        <input type="text" id="transfer-function-den">
      </div>
      <div id="output-options" class="block-options">
        <label for="output-name">Name:</label>
        <input type="text" id="output-name">
      </div>
      <div id="gain-options" class="block-options" style="display:none;">
        <label for="gain-name">Name:</label>
        <input type="text" id="gain-name">
        <label for="gain-value">Gain:</label>
        <input type="text" id="gain-value">
        <div style="margin-top: 10px; display: flex; align-items: center;">
          <input type="checkbox" id="flip-gain-checkbox">
          <label for="flip-gain-checkbox" style="margin-left: 5px;">Flip Horizontally</label>
        </div>
      </div>
      <div id="operation-options" class="block-options">
        <div style="display: flex; align-items: center; margin-bottom: 10px;">
          <label for="operator-1" style="margin-right: 5px;">1:</label>
          <select id="operator-1">
            <option value="+">+</option>
            <option value="-">-</option>
          </select>
        </div>
        <div style="display: flex; align-items: center; margin-bottom: 10px;">
          <label for="operator-2" style="margin-right: 5px;">2:</label>
          <select id="operator-2">
            <option value="+">+</option>
            <option value="-">-</option>
          </select>
          <select id="position-2" style="margin-left: 5px;">
            <option value="bottom">bottom</option>
            <option value="top">top</option>
          </select>
        </div>
      </div>
      <div id="pid-options" class="block-options" data-mode="PID" style="display:none;">
        <label for="pid-name">Name:</label>
        <input type="text" id="pid-name">
        <label for="pid-mode">Mode:</label>
        <select id="pid-mode">
          <option value="P">P</option>
          <option value="PI">PI</option>
          <option value="PD">PD</option>
          <option value="PID" selected>PID</option>
        </select>
        <div id="pid-formula" class="pid-formula" style="margin: 10px 0; font-weight: bold;">
          K<sub>p</sub> (1 + 1/(T<sub>i</sub>*s) + T<sub>d</sub>*s)
        </div>
        <div id="pid-params">
          <div class="pid-field" id="pid-kp-row">
            <label for="pid-kp">K<sub>p</sub>:</label>
            <input type="text" id="pid-kp">
          </div>
          <div class="pid-field" id="pid-ti-row">
            <label for="pid-ti">T<sub>i</sub>:</label>
            <input type="text" id="pid-ti">
          </div>
          <div class="pid-field" id="pid-td-row">
            <label for="pid-td">T<sub>d</sub>:</label>
            <input type="text" id="pid-td">
          </div>
          <div class="pid-field" id="pid-filter-n-row">
            <label for="pid-filter-n">N:</label>
            <input type="text" id="pid-filter-n" value="100">
          </div>
        </div>
      </div>
      <div id="text-options" class="block-options" style="display:none;">
        <label for="text-block-value">Text:</label>
        <textarea id="text-block-value" rows="5"></textarea>
      </div>
      <button id="apply-changes">Apply</button>
    </div>
  </div>

  <script>
    const BLOCK_PARAM_DEFAULTS = Object.freeze({
      'input': Object.freeze({
        'data-signal': 'step',
        'data-t0': '',
        'data-a0': '',
        'data-a': '',
        'data-m': '',
        'data-epsilon': '10^-3'
      }),
      'operation': Object.freeze({
        'data-operator-1': '+',
        'data-operator-2': '-',
        'data-position': 'bottom'
      }),
      'gain': Object.freeze({
        'data-gain': '',
        'data-flipped': '0'
      }),
      'pid': Object.freeze({
        'data-mode': 'PID',
        'data-kp': '',
        'data-ti': '',
        'data-td': '',
        'data-filter-n': '100'
      }),
      'text': Object.freeze({
        'data-text': 'Text'
      })
    });

    // Basic classes for Block and Connection
    class Block {
      constructor(id, type, element) {
        this.id = id;
        this.type = type;
        this.element = element;
        this.connectors = [];
      }
      addConnector(connector) {
        this.connectors.push(connector);
      }
      removeConnector(connector) {
        this.connectors = this.connectors.filter(existing => existing !== connector);
      }
    }

    class Connection {
      constructor(id, from, to, path) {
        this.id = id;
        this.from = from;
        this.to = to;
        this.path = path;
        this.selected = false;
        this.arrow = true;  // default: show arrow head
      }
    }

    class Diagram {
      constructor() {
        this.container = null;
        this.canvas = null;
        this.ctx = null;
        this.blocks = [];
        this.connections = [];
        this.isConnecting = false;
        this.currentPath = [];
        this.selectedBlock = null;
        this.selectedConnection = null;
        this.startConnector = null;
        this.connectionCount = 1;
        this.blockCount = 0;
        this.lineConnectorCount = 1;
        this.isDragging = false;
      }

      // Helpers for distance and point-on-line calculations
      static pointToSegmentDistance(px, py, x1, y1, x2, y2) {
        const A = px - x1, B = py - y1, C = x2 - x1, D = y2 - y1;
        const dot = A * C + B * D;
        const len_sq = C * C + D * D;
        const param = len_sq !== 0 ? dot / len_sq : -1;
        let xx, yy;
        if (param < 0) { xx = x1; yy = y1; }
        else if (param > 1) { xx = x2; yy = y2; }
        else { xx = x1 + param * C; yy = y1 + param * D; }
        const dx = px - xx, dy = py - yy;
        return Math.sqrt(dx * dx + dy * dy);
      }

      static isPointOnPath(path, x, y) {
        const tolerance = 6;
        for (let i = 0; i < path.length - 1; i++) {
          const distance = Diagram.pointToSegmentDistance(x, y, path[i][0], path[i][1], path[i+1][0], path[i+1][1]);
          if (distance <= tolerance) return true;
        }
        return false;
      }

      init() {
        this.container = document.getElementById('diagram-container');
        this.canvas = document.getElementById('diagram-canvas');
        this.ctx = this.canvas.getContext('2d');
        this.resizeCanvas();

        // Set up event listeners for buttons and canvas events
        // If you won't use an #add-block-btn button, comment out or remove the above line:
        const addBtn = document.getElementById('add-block-btn');
        if (addBtn) addBtn.addEventListener('click', () => this.addBlock());


        this.container.addEventListener('mousedown', (e) => {
          if (e.target.classList?.contains('connector')) return;
          if (this.isConnecting) {
            const lastPoint = this.currentPath[this.currentPath.length - 1];
            const [endX, endY] = this.getSnappedCoordinates(e.clientX, e.clientY, lastPoint);
            this.currentPath.push([endX, endY]);
            this.redrawConnections();
          } else {
            this.deselectBlock();
          }
        });

        // For connection creation and cancellation
        document.addEventListener('keydown', (e) => { if (e.key === 'Escape') this.cancelConnection(); });
        this.canvas.addEventListener('mousedown', (e) => this.checkConnectionSelection(e));
        window.addEventListener('resize', () => this.resizeCanvas());

        this.canvas.addEventListener('mousemove', (e) => {
          const rect = this.canvas.getBoundingClientRect();
          const x = e.clientX - rect.left;
          const y = e.clientY - rect.top;
          let overConnection = false;
          for (const conn of this.connections) {
            if (Diagram.isPointOnPath(conn.path, x, y)) {
              overConnection = true;
              break;
            }
          }
          this.canvas.style.cursor = overConnection ? 'pointer' : 'default';
        });
      }

      // Resize the canvas based on container dimensions
      resizeCanvas() {
        this.canvas.width = this.container.clientWidth;
        this.canvas.height = this.container.clientHeight;
        this.redrawConnections();
      }

      // Create a new block
      addBlock(blockType) {
        // Increment blockCount to ensure unique IDs
        const blockId = 'Block' + this.blockCount++;

        const block = document.createElement('div');
        block.classList.add('block', blockType);
        block.id = blockId;

        let blockName = document.createElement('div');
        blockName.classList.add('block-name');
        if (blockType === 'gain') {
          blockName.innerText = "K";
        } else if (blockType === 'pid') {
          blockName.innerText = `Controller ${this.blockCount}`;
        } else if (blockType !== 'operation') {
          blockName.innerText = `${blockType.charAt(0).toUpperCase() + blockType.slice(1)} ${this.blockCount}`;
        }
        block.style.left = (this.container.clientWidth / 2 - 60) + 'px';
        block.style.top = (this.container.clientHeight / 2 - 30) + 'px';
        this.container.appendChild(block);
        block.appendChild(blockName);

        // Add extra content for TransferFunction blocks
        if (blockType === 'transfer_function') {
          const tfContent = document.createElement('div');
          tfContent.classList.add('transfer-function-content');
          block.appendChild(tfContent);
        }
        if (blockType === 'text') {
          const textContent = document.createElement('div');
          textContent.classList.add('text-block-content');
          block.insertBefore(textContent, blockName);
        }
        let pidContent = null;
        if (blockType === 'pid') {
          pidContent = document.createElement('div');
          pidContent.classList.add('pid-content');
          block.insertBefore(pidContent, blockName);
        }

        this.setDefaultAttributes(block, blockType, blockName.innerText);
        if (blockType === 'transfer_function') {
          this.updateTransferFunctionBlockContent(block);
        }
        if (pidContent) {
           this.updatePidBlockContent(block);
        }
        if (blockType === 'text') {
          this.ensureTextBlockContent(block, block.getAttribute('data-text') || 'Text');
        }
        const newBlock = new Block(blockId, blockType, block);
        this.blocks.push(newBlock);
        this.selectBlock(block);
        this.addConnectors(newBlock);

        // For Operation blocks, set default operators
        if (blockType === 'operation') {
          this.updateLeftOperatorText(block, '+');
          this.updateBottomOperatorText(block, '-');
        }
        this.makeBlockDraggable(block);
      }

      // Set default attributes for a block based on type
      setDefaultAttributes(block, blockType, name) {
        block.setAttribute('data-name', name);
        if (blockType === 'input') {
          block.setAttribute('data-signal', 'step');
          block.setAttribute('data-t0', '');
          block.setAttribute('data-a0', '');
          block.setAttribute('data-a', '');
          block.setAttribute('data-m', '');
          block.setAttribute('data-epsilon', '10^-3');
        } else if (blockType === 'transfer_function') {
          block.setAttribute('data-numerator', '');
          block.setAttribute('data-denominator', '');
        } else if (blockType === 'operation') {
          block.setAttribute('data-operator-1', '+');
          block.setAttribute('data-operator-2', '-');
          block.setAttribute('data-position', 'bottom');
        } else if (blockType === 'gain') {
          block.setAttribute('data-gain', '');
          block.setAttribute('data-flipped', '0'); // Default flip attribute
          block.innerHTML = `
            <svg width="60" height="60" viewBox="0 0 60 60">
              <polygon points="0,0 60,30 0,60" fill="white" stroke="black" stroke-width="2"/>
            </svg>
            <div class="block-name">K</div>
          `;
        } else if (blockType === 'pid') {
          block.setAttribute('data-mode', 'PID');
          block.setAttribute('data-kp', '');
          block.setAttribute('data-ti', '');
          block.setAttribute('data-td', '');
          block.setAttribute('data-filter-n', '100');
        } else if (blockType === 'text') {
          block.setAttribute('data-text', 'Text');
        }
      }

      normalizeTextBlockValue(value) {
        return typeof value === 'string' ? value.replace(/\r\n/g, '\n') : '';
      }

      isTextBlockEmpty(value) {
        return this.normalizeTextBlockValue(value).trim() === '';
      }

      ensureTextBlockContent(block, value) {
        if (!block) return;
        let textContent = block.querySelector('.text-block-content');
        const blockName = block.querySelector('.block-name');
        if (!textContent) {
          textContent = document.createElement('div');
          textContent.classList.add('text-block-content');
          if (blockName) {
            block.insertBefore(textContent, blockName);
          } else {
            block.appendChild(textContent);
          }
        }
        this.renderTextBlockContent(textContent, value);
      }

      renderTextBlockContent(textContent, value) {
        const text = this.normalizeTextBlockValue(value);
        if (!textContent.isConnected) {
          textContent.textContent = text;
          requestAnimationFrame(() => this.renderTextBlockContent(textContent, text));
          return;
        }
        if (window.MathJax?.typesetClear) {
          window.MathJax.typesetClear([textContent]);
        }
        textContent.textContent = text;
        if (window.MathJax?.typesetPromise) {
          window.MathJax.typesetPromise([textContent]).catch(error => {
            console.error('Could not render MathJax in text block:', error);
          });
        }
      }

      updateTransferFunctionBlockContent(block) {
        if (!block || !block.classList.contains('transfer_function')) return;
        const contentEl = block.querySelector('.transfer-function-content');
        if (!contentEl) return;

        const numerator = (this.resolveAttributeValue(block, 'data-numerator', '') || '').trim();
        const denominator = (this.resolveAttributeValue(block, 'data-denominator', '') || '').trim();

        if (!numerator || !denominator) {
          contentEl.innerHTML = '';
          return;
        }

        contentEl.innerHTML = `
          <div class="numerator">${numerator}</div>
          <hr>
          <div class="denominator">${denominator}</div>
        `;
      }

        normalizePidParamValue(value, fallback) {
          if (typeof value !== 'string') {
            value = value == null ? '' : String(value);
          }
          const trimmed = value.trim();
          return trimmed === '' ? fallback : trimmed;
        }

        formatPidEquation(mode, kp, ti, td) {
          const safeMode = (mode || 'PID').toUpperCase();
          const kpValue = this.normalizePidParamValue(kp, '');
          const tiValue = this.normalizePidParamValue(ti, '');
          const tdValue = this.normalizePidParamValue(td, '');

          if (safeMode === 'P') return kpValue ? kpValue : '';
          if (safeMode === 'PI') return kpValue && tiValue ? `${kpValue} (1 + 1/(${tiValue}*s))` : '';
          if (safeMode === 'PD') return kpValue && tdValue ? `${kpValue} (1 + ${tdValue}*s)` : '';
          if (!(kpValue && tiValue && tdValue)) return '';
          return `${kpValue} (1 + 1/(${tiValue}*s) + ${tdValue}*s)`;
        }

        updatePidBlockContent(block) {
          if (!block || !block.classList.contains('pid')) return;
          const pidContent = block.querySelector('.pid-content');
          if (!pidContent) return;

          const mode = this.resolveAttributeValue(block, 'data-mode', 'PID').toUpperCase();
          const kp = this.resolveAttributeValue(block, 'data-kp', '');
          const ti = this.resolveAttributeValue(block, 'data-ti', '');
          const td = this.resolveAttributeValue(block, 'data-td', '');
          pidContent.textContent = this.formatPidEquation(mode, kp, ti, td);
        }

      resolveAttributeValue(block, attr, fallback) {
        const value = block.getAttribute(attr);
        if (value !== null && value !== '') {
          return value;
        }
        if (fallback !== undefined) {
          return fallback;
        }
        const blockType = block.classList[1];
        const defaults = BLOCK_PARAM_DEFAULTS[blockType];
        if (defaults && Object.prototype.hasOwnProperty.call(defaults, attr)) {
          return defaults[attr];
        }
        return '';
      }

      // Add connectors based on block type
      addConnectors(blockObj) {
        const connectorsMap = {
          'input': ['right'],
          'output': ['left'],
          'transfer_function': ['left', 'right'],
          'operation': ['left', 'right', 'bottom'],
          'gain': ['left', 'right'],
          'pid': ['left', 'right']
        };
        (connectorsMap[blockObj.type] || []).forEach(position => {
          const connector = document.createElement('div');
          connector.classList.add('connector', position, blockObj.id); // Add block ID to classList
          // Assign unique ID for connector
          connector.id = `${blockObj.id}_connector_${position}`;
          blockObj.element.appendChild(connector);
          connector.addEventListener('mousedown', (event) => this.startConnection(event));
          blockObj.addConnector(connector);
        });
      }

      // Make block draggable (unless connected)
      makeBlockDraggable(block) {
        let startX, startY, offsetX, offsetY;
        block.addEventListener('mousedown', (event) => {
          if (event.target.classList.contains('connector')) return;
          event.stopPropagation();
          this.selectBlock(block);
          if (this.isBlockConnected(block)) return;
          this.isDragging = true;
          startX = event.clientX;
          startY = event.clientY;
          offsetX = startX - block.offsetLeft;
          offsetY = startY - block.offsetTop;
          const moveHandler = (e) => this.onMouseMove(e, block, offsetX, offsetY);
          document.addEventListener('mousemove', moveHandler);
          const upHandler = () => {
            this.isDragging = false;
            document.removeEventListener('mousemove', moveHandler);
            document.removeEventListener('mouseup', upHandler);
          };
          document.addEventListener('mouseup', upHandler);
        });
      }

      onMouseMove(event, block, offsetX, offsetY) {
        if (!this.isDragging || !this.selectedBlock) return;
        let newX = Math.max(0, Math.min(this.canvas.width - block.clientWidth, event.clientX - offsetX));
        let newY = Math.max(0, Math.min(this.canvas.height - block.clientHeight, event.clientY - offsetY));
        this.selectedBlock.style.left = newX + 'px';
        this.selectedBlock.style.top = newY + 'px';
        this.redrawConnections();
      }

      isBlockConnected(block) {
        const blockConnectors = Array.from(block.querySelectorAll('.connector'));
        return this.connections.some(connection =>
          blockConnectors.includes(connection.from) || blockConnectors.includes(connection.to)
        );
      }

      // Block selection and edit menu display
      selectBlock(block) {
        this.deselectConnection();
        document.querySelectorAll('.block').forEach(b => b.classList.remove('selected'));
        block.classList.add('selected');
        this.selectedBlock = block;
        this.showEditMenu(block);
      }

      deselectBlock() {
        if (this.selectedBlock) {
          this.selectedBlock.classList.remove('selected');
          this.selectedBlock = null;
          document.getElementById('edit-menu').style.display = 'none';
        }
      }

      // Connection creation logic
      startConnection(event) {
        const connector = event.target;
        event.stopPropagation();
        // Prevent starting new connection on block connectors that already have connections (excluding line connectors)
        if (!connector.classList.contains('line-connector') &&
            this.connections.some(conn => conn.from === connector || conn.to === connector)) {
          return;
        }
        if (this.isConnecting) {
            // Don't start a new connection, complete the existing one
            this.completeConnection(connector);
            return;
        }
        this.isConnecting = true;
        this.startConnector = connector;
        this.startConnector.classList.add('active');
        this.currentPath = [this.getConnectorCenter(this.startConnector)];

        // Temporary handlers for connection creation
        document.addEventListener('mousemove', this.handleMouseMove = (e) => {
          if (!this.isConnecting) return;
          const lastPoint = this.currentPath[this.currentPath.length - 1];
          const [endX, endY] = this.getSnappedCoordinates(e.clientX, e.clientY, lastPoint);
          this.redrawConnections();
          this.drawPath([lastPoint, [endX, endY]], false);
        });

        document.addEventListener('mousedown', this.handleMouseDown = (e) => {
          if (!this.isConnecting) return;
          const target = e.target;
          if (target === this.canvas) {
            // Allow adding waypoints but not completing the connection
            const lastPoint = this.currentPath[this.currentPath.length - 1];
            const [endX, endY] = this.getSnappedCoordinates(e.clientX, e.clientY, lastPoint);
            this.currentPath.push([endX, endY]);
            this.redrawConnections();
          } else if (target.classList?.contains('connector')) {
            // Only complete connections on actual connectors
            e.stopImmediatePropagation();
            e.stopPropagation();
            e.preventDefault();
            this.completeConnection(target);
          }
        });

        document.addEventListener('keydown', this.handleKeyDown = (e) => {
          if (e.key === 'Escape') this.cancelConnection();
        });
      }

      completeConnection(target) {
        // If target is the same as the startConnector, cancel the connection
        if (target === this.startConnector) {
          this.cancelConnection();
          return;
        }
        document.removeEventListener('mousemove', this.handleMouseMove);
        document.removeEventListener('mousedown', this.handleMouseDown);
        document.removeEventListener('keydown', this.handleKeyDown);
        const lastPoint = this.currentPath[this.currentPath.length - 1];
        const finalPoint = this.getConnectorCenter(target);
        if (target.classList.contains('left') || target.classList.contains('right')) {
          this.currentPath.push([lastPoint[0], finalPoint[1]], finalPoint);
        } else {
          this.currentPath.push([finalPoint[0], lastPoint[1]], finalPoint);
        }
        this.connections.push(new Connection(
          'Connection' + this.connectionCount++,
          this.startConnector,
          target,
          this.currentPath
        ));
        this.isConnecting = false;
        this.startConnector.classList.remove('active');
        this.startConnector = null;
        this.currentPath = [];
        this.redrawConnections();
      }

      cancelConnection() {
        if (!this.isConnecting) return;
        document.removeEventListener('mousemove', this.handleMouseMove);
        document.removeEventListener('mousedown', this.handleMouseDown);
        document.removeEventListener('keydown', this.handleKeyDown);

        // If canceling a split connection from a line connector, clean up and join the split
        const anchor = this.startConnector?.parentElement;
        if (anchor && anchor.getAttribute && anchor.getAttribute('data-temp-connector') === 'true') {
            // Find the two split connections
            const lineConnector = this.startConnector;
            // Find connections that use this line connector
            const splitConnections = this.connections.filter(conn => conn.from === lineConnector || conn.to === lineConnector);
            // Find the original connection (the one that ends at the line connector)
            const originalConn = splitConnections.find(conn => conn.to === lineConnector);
            const branchConn = splitConnections.find(conn => conn.from === lineConnector);
            if (originalConn && branchConn) {
                // Join the two paths
                const joinedPath = [...originalConn.path.slice(0, -1), ...branchConn.path];
                // Restore the original connection's endpoint and path
                originalConn.to = branchConn.to;
                originalConn.path = joinedPath;
                originalConn.arrow = true;
                // Remove the branch connection from the list
                this.connections = this.connections.filter(conn => conn !== branchConn);
            }
            // Remove the temporary anchor and connector
            anchor.remove();
            this.startConnector?.classList.remove('active');
            this.startConnector = null;
            this.isConnecting = false;
            this.currentPath = [];
            this.redrawConnections();
            return;
        }

        this.isConnecting = false;
        this.startConnector?.classList.remove('active');
        this.startConnector = null;
        this.currentPath = [];
        this.redrawConnections();
      }

      // Connection selection
      selectConnection(connection) {
        this.deselectBlock();
        this.connections.forEach(conn => conn.selected = false);
        connection.selected = true;
        this.selectedConnection = connection;
        this.redrawConnections();
      }

      deselectConnection() {
        if (this.selectedConnection) {
          this.selectedConnection.selected = false;
          this.selectedConnection = null;
          this.redrawConnections();
        }
      }

      // Delete selected block or connection
      deleteSelected() {
        if (this.selectedBlock) {
          this.deleteConnectionsForElement(this.selectedBlock);
          this.container.removeChild(this.selectedBlock);
          this.blocks = this.blocks.filter(b => b.element !== this.selectedBlock);
          this.selectedBlock = null;
          document.getElementById('edit-menu').style.display = 'none';
        } else if (this.selectedConnection) {
          this.deleteConnectionsForElement(this.selectedConnection);
        } else {
          alert('No block or connection selected!');
          return;
        }
        this.redrawConnections();
      }

      deleteConnectionsForElement(element) {
        if (!element) return;
        // If deleting a block, delete all connections for its connectors (and recursively for line connectors)
        if (element.classList?.contains('block')) {
          const blockConnectors = Array.from(element.querySelectorAll('.connector'));
          blockConnectors.forEach(connector => {
            // Find all connections involving this connector
            const relatedConnections = this.connections.filter(connection =>
              connection.from === connector || connection.to === connector
            );
            relatedConnections.forEach(connection => {
              // If the other end is a line connector, recursively delete all connections for that line connector
              const otherConnector = connection.from === connector ? connection.to : connection.from;
              if (otherConnector && otherConnector.classList?.contains('line-connector')) {
                this.deleteConnectionsForLineConnector(otherConnector);
              }
              // Remove this connection
              const idx = this.connections.indexOf(connection);
              if (idx !== -1) this.connections.splice(idx, 1);
            });
          });
        } else if (this.connections.includes(element)) {
          // If connection involves a split line connector, remove all related connections and the connector anchor
          const isLineConn = element.from.classList?.contains('line-connector')
                          || element.to.classList?.contains('line-connector');
          if (isLineConn) {
            // Identify the connector div
            const connector = element.from.classList.contains('line-connector')
                             ? element.from : element.to;
            this.deleteConnectionsForLineConnector(connector);
          } else {
            // Regular connection removal
            this.connections.splice(this.connections.indexOf(element), 1);
            this.deselectConnection();
          }
        }
      }

      // Recursively delete all connections for a line connector and remove its anchor
      deleteConnectionsForLineConnector(lineConnector) {
        // Remove all connections using this line connector
        const relatedConnections = this.connections.filter(conn =>
          conn.from === lineConnector || conn.to === lineConnector
        );
        relatedConnections.forEach(conn => {
          // If the other end is also a line connector, recurse
          const otherConnector = conn.from === lineConnector ? conn.to : conn.from;
          if (otherConnector && otherConnector.classList?.contains('line-connector') && otherConnector !== lineConnector) {
            this.deleteConnectionsForLineConnector(otherConnector);
          }
          const idx = this.connections.indexOf(conn);
          if (idx !== -1) this.connections.splice(idx, 1);
        });
        // Remove the temporary anchor element
        const anchor = lineConnector.parentElement;
        if (anchor && anchor.getAttribute && anchor.getAttribute('data-temp-connector') === 'true' && anchor.remove) {
          anchor.remove();
        }
        this.deselectConnection();
      }

      // Drawing and coordinate helpers
      getConnectorCenter(connector) {
        const rect = this.canvas.getBoundingClientRect();
        const centerX = connector.getBoundingClientRect().left + connector.offsetWidth / 2 - rect.left;
        const centerY = connector.getBoundingClientRect().top + connector.offsetHeight / 2 - rect.top;
        return [centerX, centerY];
      }

      getSnappedCoordinates(clientX, clientY, lastPoint) {
        const rect = this.canvas.getBoundingClientRect();
        const x = clientX - rect.left;
        const y = clientY - rect.top;
        return Math.abs(x - lastPoint[0]) > Math.abs(y - lastPoint[1])
          ? [x, lastPoint[1]]
          : [lastPoint[0], y];
      }

      drawArrowhead(ctx, from, to) {
        const headlen = 10;
        const angle = Math.atan2(to[1] - from[1], to[0] - from[0]);
        ctx.moveTo(to[0], to[1]);
        ctx.lineTo(to[0] - headlen * Math.cos(angle - Math.PI / 6), to[1] - headlen * Math.sin(angle - Math.PI / 6));
        ctx.moveTo(to[0], to[1]);
        ctx.lineTo(to[0] - headlen * Math.cos(angle + Math.PI / 6), to[1] - headlen * Math.sin(angle + Math.PI / 6));
      }

      drawPath(path, isSelected) {
        if (!path || path.length < 2) return;
        this.ctx.beginPath();
        this.ctx.moveTo(path[0][0], path[0][1]);
        for (let i = 1; i < path.length; i++) {
          this.ctx.lineTo(path[i][0], path[i][1]);
        }
        this.ctx.strokeStyle = isSelected ? '#ff0000' : '#000';
        this.ctx.lineWidth = 2;
        this.ctx.stroke();
        // Removed arrowhead drawing from temporary preview
      }

      drawConnection(connection) {
        if (!connection.path || connection.path.length < 2) return;
        this.ctx.beginPath();
        this.ctx.moveTo(connection.path[0][0], connection.path[0][1]);
        for (let i = 1; i < connection.path.length; i++) {
          this.ctx.lineTo(connection.path[i][0], connection.path[i][1]);
        }
        this.ctx.strokeStyle = connection.selected ? '#ff0000' : '#000';
        this.ctx.lineWidth = 2;
        this.ctx.stroke();
        if (connection.arrow) {  // draw arrow only for ending points
          const from = connection.path[connection.path.length - 2];
          const to = connection.path[connection.path.length - 1];
          this.ctx.beginPath();
          this.drawArrowhead(this.ctx, from, to);
          this.ctx.stroke();
        }
      }

      redrawConnections() {
        this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
        this.connections.forEach(connection => this.drawConnection(connection));
        if (this.currentPath.length > 1) {
          this.drawPath(this.currentPath, false);
        }
      }

      checkConnectionSelection(event) {
        const rect = this.canvas.getBoundingClientRect();
        const x = event.clientX - rect.left;
        const y = event.clientY - rect.top;
        for (const connection of this.connections) {
          if (Diagram.isPointOnPath(connection.path, x, y)) {
            if (this.isConnecting) {
              // Don't allow completing connections on existing lines
              return;
            } else if (connection === this.selectedConnection) {
              // If clicking on an already selected connection, split it and create a branch
              this.createConnectorAndSplit(connection, x, y);
              return;
            } else {
              this.selectConnection(connection);
            }
            return;
          }
        }
        this.deselectConnection();
      }

      // Add this new method to create a connector and split a connection
      createConnectorAndSplit(connection, x, y) {
        // Find segment where connection should be split
        const path = connection.path;
        let segmentIndex = 0, minDistance = Infinity;
        let exactX = x, exactY = y;
        
        // Find closest segment and the exact point on that segment
        for (let i = 0; i < path.length - 1; i++) {
          const x1 = path[i][0], y1 = path[i][1];
          const x2 = path[i+1][0], y2 = path[i+1][1];
          
          const dist = Diagram.pointToSegmentDistance(x, y, x1, y1, x2, y2);
          if (dist < minDistance) {
            minDistance = dist;
            segmentIndex = i;
            
            // Calculate exact point on the line segment
            const A = x - x1, B = y - y1, C = x2 - x1, D = y2 - y1;
            const dot = A * C + B * D;
            const len_sq = C * C + D * D;
            const param = len_sq !== 0 ? Math.max(0, Math.min(1, dot / len_sq)) : 0;
            exactX = x1 + param * C;
            exactY = y1 + param * D;
          }
        }
        
        // Create anchor element with a marker attribute for temporary connectors
        const anchor = document.createElement('div');
        anchor.classList.add('block');
        anchor.setAttribute('data-temp-connector', 'true');
        
        // Position anchor so the connector will be centered exactly on the line
        Object.assign(anchor.style, {
          position: 'absolute',
          left: (exactX - 10) + 'px',
          top: (exactY - 10) + 'px',
          width: '20px',
          height: '20px',
          background: 'transparent',
          border: 'none'
        });
        
        // Create connector with a unique ID
        const connector = document.createElement('div');
        connector.id = `lineConnector${this.lineConnectorCount++}`;
        connector.classList.add('connector', 'line-connector'); // Add line-connector and split-connector classes
        Object.assign(connector.style, {
          position: 'absolute',
          left: '50%',
          top: '50%',
          transform: 'translate(-50%, -50%)'
        });
        
        // Add connector to diagram
        this.container.appendChild(anchor);
        anchor.appendChild(connector);
        
        // Save original connection data for potential reversion
        connection.originalPath = connection.path.slice();
        connection.originalTo = connection.to;
        
        // Split connection into two segments
        const firstPath = [...path.slice(0, segmentIndex + 1), [exactX, exactY]];
        const secondPath = [[exactX, exactY], ...path.slice(segmentIndex + 1)];
        
        // Create new connection for the second segment
        const newConnection = new Connection(
          'Connection' + this.connectionCount++,
          connector, // New connector (line connector)
          connection.to, // Original endpoint
          secondPath
        );
        
        // Update original connection to end at new connector and set arrow properties
        connection.path = firstPath;
        connection.to = connector; // New connector (line connector)
        connection.arrow = false;
        newConnection.arrow = true;
        
        // Mark the anchor with reference IDs for undoing the split when cancelling
        anchor.setAttribute('data-original-connection-id', connection.id);
        anchor.setAttribute('data-new-connection-id', newConnection.id);
        
        // Track connector for cleanup and add to connections list
        connection.lineConnector = anchor;
        this.connections.push(newConnection);
        
        this.redrawConnections();
        this.startConnection({ target: connector, stopPropagation: () => {} });

      }

      // Edit menu handling for different block types
      showEditMenu(block) {
        const editMenu = document.getElementById('edit-menu');
        editMenu.style.display = 'block';
        const blockType = block.classList[1];
        const textEl = document.getElementById('edit-menu-text');
        textEl.innerHTML = 'Block type: ' + blockType;
        document.querySelectorAll('.block-options').forEach(option => option.style.display = 'none');
        this.showBlockTypeOptions(block, blockType);
      }

      showBlockTypeOptions(block, blockType) {
        if (blockType === 'input') this.showInputOptions(block);
        else if (blockType === 'transfer_function') this.showTransferFunctionOptions(block);
        else if (blockType === 'output') this.showOutputOptions(block);
        else if (blockType === 'operation') this.showOperationOptions(block);
        else if (blockType === 'gain') this.showGainOptions(block);
        else if (blockType === 'pid') this.showPidOptions(block);
        else if (blockType === 'text') this.showTextOptions(block);
      }

      showInputOptions(block) {
        const options = document.getElementById('input-options');
        options.style.display = 'block';
        document.getElementById('input-name').value = block.getAttribute('data-name') || '';
        const signal = this.resolveAttributeValue(block, 'data-signal', 'step');
        document.getElementById('input-signal').value = signal;
        const extraOptions = document.getElementById('input-extra-options');
        extraOptions.style.display = 'block';
        ['step-options', 'impulse-options', 'ramp-options'].forEach(id => {
          document.getElementById(id).style.display = 'none';
        });
        document.getElementById('input-t0').value = this.resolveAttributeValue(block, 'data-t0');
        if (signal === 'step') {
          document.getElementById('step-options').style.display = 'block';
          document.getElementById('input-step-a0').value = this.resolveAttributeValue(block, 'data-a0');
          document.getElementById('input-step-a').value = this.resolveAttributeValue(block, 'data-a');
        } else if (signal === 'impulse') {
          document.getElementById('impulse-options').style.display = 'block';
          document.getElementById('input-impulse-a').value = this.resolveAttributeValue(block, 'data-a');
          document.getElementById('input-impulse-epsilon').value = this.resolveAttributeValue(block, 'data-epsilon', '10^-3');
        } else if (signal === 'ramp') {
          document.getElementById('ramp-options').style.display = 'block';
          document.getElementById('input-ramp-a0').value = this.resolveAttributeValue(block, 'data-a0');
          // Ramp block no longer uses the A field
          document.getElementById('input-ramp-m').value = this.resolveAttributeValue(block, 'data-m');
        }
      }

      showTransferFunctionOptions(block) {
        document.getElementById('transfer-function-options').style.display = 'block';
        document.getElementById('transfer-function-name').value = block.getAttribute('data-name') || '';
        document.getElementById('transfer-function-num').value = block.getAttribute('data-numerator') || '';
        document.getElementById('transfer-function-den').value = block.getAttribute('data-denominator') || '';
      }

      showOutputOptions(block) {
        document.getElementById('output-options').style.display = 'block';
        document.getElementById('output-name').value = block.getAttribute('data-name') || '';
      }

      showOperationOptions(block) {
        document.getElementById('operation-options').style.display = 'block';
        this.updateConnectorPosition(block);
        document.getElementById('operator-1').value = this.resolveAttributeValue(block, 'data-operator-1', '+');
        document.getElementById('operator-2').value = this.resolveAttributeValue(block, 'data-operator-2', '-');
        document.getElementById('position-2').value = this.resolveAttributeValue(block, 'data-position', 'bottom');
      }

      showGainOptions(block) {
        document.getElementById('gain-options').style.display = 'block';
        document.getElementById('gain-name').value = block.getAttribute('data-name') || '';
        document.getElementById('gain-value').value = this.resolveAttributeValue(block, 'data-gain', '');
        const flipValue = this.resolveAttributeValue(block, 'data-flipped', '0');
        const isFlipped = flipValue === '1';
        document.getElementById('flip-gain-checkbox').checked = isFlipped;
      }

      showPidOptions(block) {
        const options = document.getElementById('pid-options');
        options.style.display = 'block';
        document.getElementById('pid-name').value = block.getAttribute('data-name') || '';
        const mode = this.resolveAttributeValue(block, 'data-mode', 'PID').toUpperCase();
        document.getElementById('pid-mode').value = mode;
        document.getElementById('pid-kp').value = this.resolveAttributeValue(block, 'data-kp');
        document.getElementById('pid-ti').value = this.resolveAttributeValue(block, 'data-ti');
        document.getElementById('pid-td').value = this.resolveAttributeValue(block, 'data-td');
        document.getElementById('pid-filter-n').value = this.resolveAttributeValue(block, 'data-filter-n', '100');
        this.updatePidOptionVisibility(mode);
      }

      showTextOptions(block) {
        const options = document.getElementById('text-options');
        options.style.display = 'block';
        document.getElementById('text-block-value').value = this.resolveAttributeValue(block, 'data-text', '');
      }

      updatePidOptionVisibility(mode) {
        mode = (mode || 'PID').toUpperCase();
        const options = document.getElementById('pid-options');
        if (options) options.setAttribute('data-mode', mode);
        const formulas = {
          'P': 'K<sub>p</sub>',
          'PI': 'K<sub>p</sub> (1 + 1/(T<sub>i</sub>*s))',
          'PD': 'K<sub>p</sub> (1 + T<sub>d</sub>*s)',
          'PID': 'K<sub>p</sub> (1 + 1/(T<sub>i</sub>*s) + T<sub>d</sub>*s)'
        };
        const formulaEl = document.getElementById('pid-formula');
        if (formulaEl) formulaEl.innerHTML = formulas[mode] || formulas['PID'];
        const tiRow = document.getElementById('pid-ti-row');
        const tdRow = document.getElementById('pid-td-row');
        const filterNRow = document.getElementById('pid-filter-n-row');
        if (tiRow) tiRow.style.display = mode.includes('I') ? 'flex' : 'none';
        if (tdRow) tdRow.style.display = mode.includes('D') ? 'flex' : 'none';
        if (filterNRow) filterNRow.style.display = mode.includes('D') ? 'flex' : 'none';
      }

      updateConnectorPosition(block) {
        const positionSelect = document.getElementById('position-2');
        const bottomConnector = block.querySelector('.connector.bottom');
        const topConnector = block.querySelector('.connector.top');
        positionSelect.value = bottomConnector ? 'bottom' : (topConnector ? 'top' : '');
      }

      updateLeftOperatorText(block, operator) {
        const leftConnector = block.querySelector('.connector.left');
        if (!leftConnector) return;
        let opText = block.querySelector('.left-operator-text');
        if (!opText) {
          opText = document.createElement('span');
          opText.classList.add('left-operator-text');
          block.appendChild(opText);
        }
        opText.innerText = operator;
        opText.style.position = 'absolute';
        opText.style.left = (leftConnector.offsetLeft - 10) + 'px';
        opText.style.top = (leftConnector.offsetTop + 5) + 'px';
        opText.style.fontWeight = 'bold';
        opText.style.fontSize = '16px';
      }

      updateBottomOperatorText(block, operator) {
        const bottomConnector = block.querySelector('.connector.bottom');
        if (!bottomConnector) return;
        let opText = block.querySelector('.bottom-operator-text');
        if (!opText) {
          opText = document.createElement('span');
          opText.classList.add('bottom-operator-text');
          block.appendChild(opText);
        }
        opText.innerText = operator;
        opText.style.position = 'absolute';
        opText.style.left = (bottomConnector.offsetLeft - 20) + 'px';
        opText.style.top = (bottomConnector.offsetTop + bottomConnector.offsetHeight - 5) + 'px';
        opText.style.fontWeight = 'bold';
        opText.style.fontSize = '16px';
      }

      updateTopOperatorText(block, operator) {
        const topConnector = block.querySelector('.connector.top');
        if (!topConnector) return;
        let opText = block.querySelector('.top-operator-text');
        if (!opText) {
          opText = document.createElement('span');
          opText.classList.add('top-operator-text');
          block.appendChild(opText);
        }
        opText.innerText = operator;
        opText.style.position = 'absolute';
        opText.style.left = (topConnector.offsetLeft - 20) + 'px';
        opText.style.top = (topConnector.offsetTop - 15) + 'px';
        opText.style.fontWeight = 'bold';
        opText.style.fontSize = '16px';
      }

      applyChanges() {
        const editMenu = document.getElementById('edit-menu');
        if (this.selectedBlock) {
          const oldFlipped = this.selectedBlock.getAttribute('data-flipped') === '1';

          Array.from(this.selectedBlock.attributes)
            .filter(attr =>
              attr.name.startsWith('data-') &&
              attr.name !== 'data-flipped'
            )
            .forEach(attr => this.selectedBlock.setAttribute(attr.name, ''));

          const blockType = this.selectedBlock.classList[1];
          if (blockType === 'input') {
            const newName = document.getElementById('input-name').value;
            const inputSignal = document.getElementById('input-signal').value;
            this.selectedBlock.setAttribute('data-name', newName);
            this.selectedBlock.setAttribute('data-signal', inputSignal);
            this.selectedBlock.setAttribute('data-t0', document.getElementById('input-t0').value);
            if (inputSignal === 'step') {
              this.selectedBlock.setAttribute('data-a0', document.getElementById('input-step-a0').value);
              this.selectedBlock.setAttribute('data-a', document.getElementById('input-step-a').value);
            } else if (inputSignal === 'impulse') {
              this.selectedBlock.setAttribute('data-a', document.getElementById('input-impulse-a').value);
              this.selectedBlock.setAttribute('data-epsilon', document.getElementById('input-impulse-epsilon').value);
            } else if (inputSignal === 'ramp') {
              this.selectedBlock.setAttribute('data-a0', document.getElementById('input-ramp-a0').value);
              // Ramp block no longer uses the A field
              this.selectedBlock.setAttribute('data-m', document.getElementById('input-ramp-m').value);
            }
            const blockNameElem = this.selectedBlock.querySelector('.block-name');
            if (blockNameElem) blockNameElem.innerText = newName;
          } else if (blockType === 'transfer_function') {
            const newName = document.getElementById('transfer-function-name').value;
            const numerator = document.getElementById('transfer-function-num').value;
            const denominator = document.getElementById('transfer-function-den').value;
            this.selectedBlock.setAttribute('data-name', newName);
            this.selectedBlock.setAttribute('data-numerator', numerator);
            this.selectedBlock.setAttribute('data-denominator', denominator);
            const blockNameElem = this.selectedBlock.querySelector('.block-name');
            if (blockNameElem) blockNameElem.innerText = newName;
            this.updateTransferFunctionBlockContent(this.selectedBlock);
          } else if (blockType === 'output') {
            const newName = document.getElementById('output-name').value;
            this.selectedBlock.setAttribute('data-name', newName);
            const blockNameElem = this.selectedBlock.querySelector('.block-name');
            if (blockNameElem) blockNameElem.innerText = newName;
          } else if (blockType === 'operation') {
            const operator1 = document.getElementById('operator-1').value;
            const operator2 = document.getElementById('operator-2').value;
            const position = document.getElementById('position-2').value;
            this.selectedBlock.setAttribute('data-operator-1', operator1);
            this.selectedBlock.setAttribute('data-operator-2', operator2);
            this.selectedBlock.setAttribute('data-position', position);
            this.updateOperationConnector(this.selectedBlock);
            this.updateLeftOperatorText(this.selectedBlock, operator1);
            if (position === 'bottom') {
              this.updateBottomOperatorText(this.selectedBlock, operator2);
              let topText = this.selectedBlock.querySelector('.top-operator-text');
              if (topText) topText.remove();
            } else if (position === 'top') {
              this.updateTopOperatorText(this.selectedBlock, operator2);
              let bottomText = this.selectedBlock.querySelector('.bottom-operator-text');
              if (bottomText) bottomText.remove();
            }
          } else if (blockType === 'gain') {
            const newName   = document.getElementById('gain-name').value;
            const gainValue = document.getElementById('gain-value').value;
            const isFlipped = document.getElementById('flip-gain-checkbox').checked;

            this.selectedBlock.setAttribute('data-name', newName);
            this.selectedBlock.setAttribute('data-gain', gainValue);
            this.selectedBlock.setAttribute('data-flipped', isFlipped ? '1' : '0');

            const blockNameElem = this.selectedBlock.querySelector('.block-name');
            if (blockNameElem) blockNameElem.innerText = newName;

            if (isFlipped !== oldFlipped) {
              this.flipGainBlock(this.selectedBlock, isFlipped);
            }
          } else if (blockType === 'pid') {
            const newName = document.getElementById('pid-name').value;
            const mode = document.getElementById('pid-mode').value.toUpperCase();
            const kp = document.getElementById('pid-kp').value;
            const ti = document.getElementById('pid-ti').value;
            const td = document.getElementById('pid-td').value;
            const filterN = document.getElementById('pid-filter-n').value;

            this.selectedBlock.setAttribute('data-name', newName);
            this.selectedBlock.setAttribute('data-mode', mode);
            this.selectedBlock.setAttribute('data-kp', kp);
            this.selectedBlock.setAttribute('data-ti', ti);
            this.selectedBlock.setAttribute('data-td', td);
            this.selectedBlock.setAttribute('data-filter-n', filterN);

            const blockNameElem = this.selectedBlock.querySelector('.block-name');
            if (blockNameElem) blockNameElem.innerText = newName;
            this.updatePidBlockContent(this.selectedBlock);
          } else if (blockType === 'text') {
            const textValue = this.normalizeTextBlockValue(document.getElementById('text-block-value').value);
            if (this.isTextBlockEmpty(textValue)) {
              this.deleteSelected();
              return;
            }
            this.selectedBlock.setAttribute('data-text', textValue);
            this.ensureTextBlockContent(this.selectedBlock, textValue);
          }

          editMenu.style.display = 'none';
        }
      }

      flipGainBlock(block, isFlipped) {
        if (!block.classList.contains('gain')) return;

        // Delete all connections for the block
        this.deleteConnectionsForElement(block);

        // Set the flipped state
        if (isFlipped) {
          block.classList.add('flipped');
          block.setAttribute('data-flipped', '1');
        } else {
          block.classList.remove('flipped');
          block.setAttribute('data-flipped', '0');
        }

        // Update the SVG to reflect the flip
        const svg = block.querySelector('svg');
        if (svg) {
          svg.style.transform = isFlipped ? 'scaleX(-1)' : 'scaleX(1)';
        }

        // Refresh the screen by redrawing connections
        this.redrawConnections();
      }

      updateOperationConnector(block) {
        const positionSelect = document.getElementById('position-2');
        const position = positionSelect.value;
        const bottomConnector = block.querySelector('.connector.bottom');
        const topConnector = block.querySelector('.connector.top');
        const blockObj = this.blocks.find(candidate => candidate.element === block);
        if (position === 'bottom' && !bottomConnector) {
          if (topConnector) {
            this.deleteConnectionsForConnector(topConnector);
            if (blockObj) blockObj.removeConnector(topConnector);
            topConnector.remove();
          }
          this.addOperationConnector(block, 'bottom');
        } else if (position === 'top' && !topConnector) {
          if (bottomConnector) {
            this.deleteConnectionsForConnector(bottomConnector);
            if (blockObj) blockObj.removeConnector(bottomConnector);
            bottomConnector.remove();
          }
          this.addOperationConnector(block, 'top');
        }
      }

      deleteConnectionsForConnector(connector) {
        this.connections = this.connections.filter(connection =>
          connection.from !== connector && connection.to !== connector
        );
        this.redrawConnections();
      }

      addOperationConnector(block, position) {
        const connector = document.createElement('div');
        connector.classList.add('connector', position, block.id); // Add block ID to classList
        connector.id = `${block.id}_connector_${position}`;
        block.appendChild(connector);
        connector.addEventListener('mousedown', (event) => this.startConnection(event));
        const blockObj = this.blocks.find(candidate => candidate.element === block);
        if (blockObj) blockObj.addConnector(connector);
      }

      logDiagram() {
        console.log('Blocks:', this.blocks);
        console.log('Connections:', this.connections);
      }

      writeJSON() {
        const blocksData = this.blocks.map(block => {
          const attributes = {};
          Array.from(block.element.attributes).forEach(attr => {
            if (attr.name.startsWith('data-')) {
              attributes[attr.name] = attr.value;
            }
          });
          const connectors = Array.from(block.element.querySelectorAll('.connector'));
        return {
            id: block.id,
            type: block.type,
            // Save position for later reload
            x: parseFloat(block.element.style.left) || 0,
            y: parseFloat(block.element.style.top) || 0,
            attributes: attributes,
            connectors: connectors.map(connector => ({
              position: Array.from(connector.classList).find(cls => ['left', 'right', 'top', 'bottom'].includes(cls)) || 'unknown',
              id: connector.id || null
            }))
        };
        });

        const connectionsData = this.connections.map(connection => ({
          id: connection.id,
          from: this.getConnectorDetails(connection.from),
          to: this.getConnectorDetails(connection.to),
          path: connection.path,
          arrow: connection.arrow
        }));

        const simTimeEl = document.getElementById('sim-time');
        const stepSizeEl = document.getElementById('step-size');
        const simTime = simTimeEl ? parseFloat(simTimeEl.value.replace(',', '.')) || 10 : 10;
        const stepSize = stepSizeEl ? parseFloat(stepSizeEl.value.replace(',', '.')) || 0.001 : 0.001;

        const diagramData = {
          blocks: blocksData,
          connections: connectionsData,
          // Persist simulation parameters alongside the diagram
          sim_time: simTime,
          step_size: stepSize
        };

        return diagramData;
      }

      // Helper function to get connector details
      getConnectorDetails(connector) {
        if (!connector) return { type: 'unknown', id: 'unknown' };

        const isLineConnector = connector.classList.contains('line-connector');
        const blockId = Array.from(connector.classList).find(cls => cls.startsWith('Block')) || connector.parentElement?.id || 'unknown';
        const position = Array.from(connector.classList).find(cls => ['left', 'right', 'top', 'bottom'].includes(cls)) || 'unknown';

        return isLineConnector
          ? { type: 'line-connector', id: connector.id || 'unknown' }
          : { type: 'block-connector', blockId, position, id: connector.id || 'unknown' };
      }

      clearDiagram() {
        this.blocks.forEach(b => {
          if (b.element && this.container.contains(b.element)) {
            this.container.removeChild(b.element);
          }
        });
        // Remove any temporary line connector anchors
        const tempAnchors = this.container.querySelectorAll('[data-temp-connector="true"]');
        tempAnchors.forEach(anchor => anchor.remove());

        this.blocks = [];
        this.connections = [];
        this.connectionCount = 1;
        this.blockCount = 0;
        this.lineConnectorCount = 1;
        this.selectedBlock = null;
        this.selectedConnection = null;
        this.currentPath = [];
        this.redrawConnections();
      }

      loadFromJSON(data) {
        this.clearDiagram();

        if (!this.container) {
          console.error('Diagram container not found. Make sure the element with ID "diagram-container" exists.');
          return;
        }

        // Track the highest Block ID
        let maxBlockId = 0;

        // Recreate blocks
        data.blocks.forEach(b => {
          const block = document.createElement('div');
          block.classList.add('block', b.type);
          block.id = b.id;

          // Update maxBlockId
          const blockIdNumber = parseInt(b.id.replace('Block', ''), 10);
          if (!isNaN(blockIdNumber)) {
            maxBlockId = Math.max(maxBlockId, blockIdNumber);
          }

          // Position block using saved coordinates
          if (typeof b.x === 'number' && typeof b.y === 'number') {
            block.style.left = b.x + 'px';
            block.style.top = b.y + 'px';
          }
          for (const [attr, value] of Object.entries(b.attributes)) {
            block.setAttribute(attr, value);
          }

          // If this is a gain block, draw its triangular SVG background
          if (b.type === 'gain') {
            const svgNS = 'http://www.w3.org/2000/svg';
            const svg = document.createElementNS(svgNS, 'svg');
            svg.setAttribute('width', '60');
            svg.setAttribute('height', '60');
            svg.setAttribute('viewBox', '0 0 60 60');
            const poly = document.createElementNS(svgNS, 'polygon');
            poly.setAttribute('points', '0,0 60,30 0,60');
            poly.setAttribute('fill', 'white');
            poly.setAttribute('stroke', 'black');
            poly.setAttribute('stroke-width', '2');
            svg.appendChild(poly);
            // Apply horizontal flip if block was flipped
            if (block.getAttribute('data-flipped') === '1') svg.style.transform = 'scaleX(-1)';
            block.appendChild(svg);
          }
          const blockName = document.createElement('div');
          blockName.classList.add('block-name');
          blockName.innerText = b.attributes['data-name'] || b.id;
          block.appendChild(blockName);

          if (b.type === 'pid') {
            const pidContent = document.createElement('div');
            pidContent.classList.add('pid-content');
            block.insertBefore(pidContent, blockName);
            this.updatePidBlockContent(block);
          }
          if (b.type === 'text') {
            this.ensureTextBlockContent(block, b.attributes['data-text'] || '');
          }

          this.container.appendChild(block);
          const blockObj = new Block(b.id, b.type, block);
          this.blocks.push(blockObj);

          // Add connectors and event listeners
          b.connectors.forEach((connectorData, index) => {
            const connector = document.createElement('div');
            connector.classList.add('connector', connectorData.position);
            connector.id = connectorData.id || `${block.id}_connector_${connectorData.position}_${index}`;
            block.appendChild(connector);
            // Enable starting connections from loaded connectors
            connector.addEventListener('mousedown', (event) => this.startConnection(event));
            blockObj.addConnector(connector);
          });

          // Render transfer function content for loaded blocks
          if (b.type === 'transfer_function') {
            const contentEl = document.createElement('div');
            contentEl.classList.add('transfer-function-content');
            // Insert before block name to ensure correct placement
            const nameEl = block.querySelector('.block-name');
            block.insertBefore(contentEl, nameEl);
            this.updateTransferFunctionBlockContent(block);
          }
          // Render operation block operators for loaded blocks
          if (b.type === 'operation') {
            const op1 = block.getAttribute('data-operator-1') || '+';
            const op2 = block.getAttribute('data-operator-2') || '-';
            this.updateLeftOperatorText(block, op1);
            if (block.getAttribute('data-position') === 'top') {
              this.updateTopOperatorText(block, op2);
            } else {
              this.updateBottomOperatorText(block, op2);
            }
          }

          this.makeBlockDraggable(block);
        });

        // Ensure blockCount starts from the next available ID
        this.blockCount = maxBlockId + 1;

        // Recreate connections
        // First, recreate any line connector used for splits
        const lineConnectorPositions = {};
        data.connections.forEach(c => {
          if (c.from.type === 'line-connector' && !lineConnectorPositions[c.from.id]) {
            lineConnectorPositions[c.from.id] = c.path[0];
          }
          if (c.to.type === 'line-connector' && !lineConnectorPositions[c.to.id]) {
            lineConnectorPositions[c.to.id] = c.path[c.path.length - 1];
          }
        });
        Object.entries(lineConnectorPositions).forEach(([id, [x, y]]) => {
          const anchor = document.createElement('div');
          anchor.classList.add('block');
          anchor.setAttribute('data-temp-connector', 'true');
          Object.assign(anchor.style, {
            position: 'absolute',
            left: (x - 10) + 'px',
            top: (y - 10) + 'px',
            width: '20px',
            height: '20px',
            background: 'transparent',
            border: 'none'
          });
          const connector = document.createElement('div');
          connector.id = id;
          connector.classList.add('connector', 'line-connector');
          Object.assign(connector.style, {
            position: 'absolute',
            left: '50%',
            top: '50%',
            transform: 'translate(-50%, -50%)'
          });

          anchor.appendChild(connector);
          this.container.appendChild(anchor);

          // Update lineConnectorCount if this is a line-connector
          if (id.startsWith('lineConnector')) {
            const idNumber = parseInt(id.replace('lineConnector', ''), 10);
            if (!isNaN(idNumber)) {
              this.lineConnectorCount = Math.max(this.lineConnectorCount, idNumber + 1);
            }
          }
        });

        // Track the highest connection ID
        let maxConnectionId = 0;

        data.connections.forEach(c => {
          const from = this.getConnectorById(c.from.id);
          const to = this.getConnectorById(c.to.id);

          if (!from) {
            console.warn(`Connector "from" not found: ${c.from.id}`);
            return;
          }

          if (!to) {
            console.warn(`Connector "to" not found: ${c.to.id}`);
            return;
          }

          const conn = new Connection(c.id, from, to, c.path);
          conn.arrow = c.arrow;
          this.connections.push(conn);

          // Update maxConnectionId
          const connectionIdNumber = parseInt(c.id.replace('Connection', ''), 10);
          if (!isNaN(connectionIdNumber)) {
            maxConnectionId = Math.max(maxConnectionId, connectionIdNumber);
          }
        });

        // Ensure connectionCount starts from the next available ID
        this.connectionCount = maxConnectionId + 1;

        this.redrawConnections();
        // If the saved diagram includes simulation parameters, restore them
        try {
          if (data && typeof data === 'object') {
            if (data.sim_time !== undefined) {
              const simEl = document.getElementById('sim-time');
              if (simEl) simEl.value = String(data.sim_time);
            }
            if (data.step_size !== undefined) {
              const stepEl = document.getElementById('step-size');
              if (stepEl) stepEl.value = String(data.step_size);
            }
          }
        } catch (e) {
          console.warn('Could not restore simulation parameters from diagram:', e);
        }
      }
      getConnectorById(id) {
        return document.getElementById(id);
      }
    }
    

    // Initialize the diagram and set up event handlers once the document is ready
    let diagram;
    document.addEventListener('DOMContentLoaded', () => {
      const diagram = new Diagram();
      diagram.init();

      const urlParams = new URLSearchParams(window.location.search);
      const SESSION_ID = urlParams.get('session');
      if (!SESSION_ID) {
        console.warn('CSSim GUI started without a session id; state will be shared.');
      }

      const SYNC_INTERVAL_MS = 2000;
      let lastSerializedDiagram = null;

      const getDiagramStateUrl = () => (
        SESSION_ID
          ? `/diagram-state?session=${encodeURIComponent(SESSION_ID)}`
          : '/diagram-state'
      );

      async function syncDiagramState(force = false) {
        if (!diagram) return;
        try {
          const serialized = diagram.writeJSON();
          const payload = JSON.stringify(serialized);
          if (!force && payload === lastSerializedDiagram) {
            return;
          }
          lastSerializedDiagram = payload;
          await fetch(getDiagramStateUrl(), {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json'
            },
            body: payload
          });
        } catch (error) {
          console.error('Error while synchronizing diagram:', error);
        }
      }

      const triggerImmediateSync = () => {
        syncDiagramState(true);
      };

      setInterval(() => {
        syncDiagramState(false);
      }, SYNC_INTERVAL_MS);

      triggerImmediateSync();

      const dropdown = document.getElementById('block-type-dropdown');
      dropdown.addEventListener('change', function () {
        const blockType = this.value;
        if (blockType) {
            diagram.addBlock(blockType);
            this.selectedIndex = 0;  // return to “Blocks” option
            this.blur();             // close dropdown
            triggerImmediateSync();
        }
      });

      document.getElementById('delete-block-btn').addEventListener('click', () => {
        diagram.deleteSelected();
        triggerImmediateSync();
      });
      document.getElementById('clear-btn').addEventListener('click', () => {
        diagram.clearDiagram();
        document.getElementById('edit-menu').style.display = 'none';
        triggerImmediateSync();
      });
      document.getElementById('apply-changes').addEventListener('click', () => {
        diagram.applyChanges();
        triggerImmediateSync();
      });

      const pidModeSelect = document.getElementById('pid-mode');
      pidModeSelect.addEventListener('change', function () {
        const mode = this.value.toUpperCase();
        diagram.updatePidOptionVisibility(mode);
      });

      document.getElementById('input-signal').addEventListener('change', function () {
        const signal = this.value;
        const extraOptions = document.getElementById('input-extra-options');
        extraOptions.style.display = 'block';
        ['step-options', 'impulse-options', 'ramp-options'].forEach(id => {
          document.getElementById(id).style.display = 'none';
        });
        if (signal === 'step') {
          document.getElementById('step-options').style.display = 'block';
        } else if (signal === 'impulse') {
          document.getElementById('impulse-options').style.display = 'block';
        } else if (signal === 'ramp') {
          document.getElementById('ramp-options').style.display = 'block';
        } else {
          extraOptions.style.display = 'none';
        }
        const inputFields = extraOptions.querySelectorAll('input[type="text"]');
        inputFields.forEach(input => input.value = '');
      });

      document.getElementById('save-btn').addEventListener('click', async () => {
        const jsonData = JSON.stringify(diagram.writeJSON(), null, 2);
        const filename = prompt('File name:', 'diagram.json');
        if (!filename) return;
        const blob = new Blob([jsonData], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        a.click();
        URL.revokeObjectURL(url);
        triggerImmediateSync();
      });

      document.getElementById('load-btn').addEventListener('click', () => {
        const input = document.createElement('input');
        input.type = 'file';
        input.accept = '.json';
        input.onchange = async (e) => {
          const file = e.target.files[0];
          if (!file) return;
          const text = await file.text();
          const data = JSON.parse(text);
          if (diagram) {
            diagram.loadFromJSON(data);
            await syncDiagramState(true);
          } else {
            console.error("Diagram object not initialized.");
          }
        };
        input.click();
      });

      async function loadInitialDiagram() {
        try {
          const resp = await fetch('/initial-diagram');
          if (!resp.ok) {
            console.error('Error fetching initial diagram:', resp.statusText);
            return;
          }
          const payload = await resp.json();
          if (payload.status === 'ok' && payload.data) {
            diagram.loadFromJSON(payload.data);
            await syncDiagramState(true);
          } else if (payload.status === 'error') {
            console.error('Error loading initial diagram:', payload.message);
            alert('Falha ao carregar diagrama inicial: ' + payload.message);
          }
        } catch (error) {
          console.error('Error loading initial diagram:', error);
        }
      }

      loadInitialDiagram();

    });


  </script>
